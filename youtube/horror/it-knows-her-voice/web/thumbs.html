<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// "Her Voice" thumbnails (one per part). Reuses the Part 4 drawing helpers.
import { capCard, chapterCard, whiteStick } from './stick.js';
import { biscuit } from './biscuit.js';
import { mrsHale } from './hale.js';
import { momThing, hand } from './mom.js';
import { skinwalker } from './skinwalker.js';
const cv = document.getElementById('c'), g = cv.getContext('2d'), W = 1080, H = 1920, P = { g };
const rr = (x, y, w, h, r, fill) => { g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = fill; g.fill(); };
const lin = (x0, y0, x1, y1, st) => { const q = g.createLinearGradient(x0, y0, x1, y1); st.forEach(([o, c]) => q.addColorStop(o, c)); return q; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), sm = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, u) => a + (b - a) * u;
const add = (fn) => { g.save(); g.globalCompositeOperation = 'lighter'; fn(); g.restore(); };
const cam = (z, fx, fy, sx = 0, sy = 0) => { g.translate(W / 2 + sx, H / 2 + sy); g.scale(z, z); g.translate(-fx, -fy); };
const darken = (a) => { g.fillStyle = `rgba(4,2,12,${a})`; g.fillRect(-1400, -900, 4000, 3800); };
const hero = (x, y, s, o) => { const br = Math.sin(T * 2.4 + x * 0.01) * 0.012; g.save(); g.translate(x, y + 975 * s * br * 0.5); g.scale(s, s * (1 - br)); g.translate(300 * br * 0.0, 0); whiteStick(P, { beanie: '#2a2a36', ...o }); g.restore(); };
const dog = (x, y, s, o) => { const br = Math.sin(T * 3.2 + x * 0.02) * 0.02; g.save(); g.translate(x, y); g.scale(s, s * (1 + br)); biscuit(g, { tail: 0.15, ...o, t: o.t ?? T }); g.restore(); };
const hale = (x, y, s, o) => { const br = Math.sin(T * 1.9) * 0.01; g.save(); g.translate(x + Math.sin(T * 0.9) * 3, y + 975 * s * br * 0.5); g.scale(s, s * (1 - br)); mrsHale(g, o); g.restore(); };
let WORDS = []; let T = 0; // global time, for idle motion
const hcam = () => { g.translate(Math.sin(T * 1.3) * 4 + Math.sin(T * 3.1) * 1.5, Math.sin(T * 1.7) * 3); }; // handheld drift

// ---------- exterior set pieces ----------
const sky = (warm = 0) => { g.fillStyle = lin(0, -400, 0, 1400, [[0, '#0a0a26'], [1, '#1e1a46']]); g.fillRect(-1400, -900, 4000, 2400);
  g.fillStyle = 'rgba(255,255,255,0.5)'; for (let k = 0; k < 40; k++) { const x = (k * 263) % 2600 - 800, y = (k * 151) % 700 - 300; g.fillRect(x, y, 3, 3); }
  g.fillStyle = '#e8e6ff'; g.beginPath(); g.arc(880, 120, 50, 0, 7); g.fill(); g.fillStyle = '#141236'; g.beginPath(); g.arc(900, 104, 46, 0, 7); g.fill(); };
const woods = (y = 1150, alpha = 1, eyes = 0) => { g.save(); g.globalAlpha = alpha;
  g.fillStyle = '#0b0918'; g.beginPath(); g.moveTo(-1400, y); for (let x = -1400; x <= 2600; x += 60) g.lineTo(x, y - 60 - 40 * Math.sin(x * 0.013) - 30 * Math.sin(x * 0.041)); g.lineTo(2600, y + 200); g.lineTo(-1400, y + 200); g.fill();
  for (let k = 0; k < 34; k++) { const sway = Math.sin(T * 1.1 + k * 0.7) * 10; const x = -1300 + k * 115 + (k % 3) * 20, h = 260 + (k * 37) % 160; g.fillStyle = k % 2 ? '#0a0816' : '#0e0b1e'; g.fillRect(x - 7, y - h, 14, h); for (let j = 0; j < 4; j++) { const yy = y - h + j * h * 0.22, sw = sway * (1 - j / 4); g.beginPath(); g.moveTo(x + sw, yy - 50); g.lineTo(x - 40 - j * 14 + sw * 0.6, yy + 60); g.lineTo(x + 40 + j * 14 + sw * 0.6, yy + 60); g.fill(); } }
  if (eyes) { g.save(); g.shadowColor = 'rgba(255,255,255,0.9)'; g.shadowBlur = 14; g.fillStyle = `rgba(244,242,238,${eyes})`; for (const [x, yy] of [[200, y - 80], [760, y - 110]]) for (const s of [-1, 1]) { g.beginPath(); g.ellipse(x + s * 9, yy, 5, 7, 0, 0, 7); g.fill(); } g.restore(); }
  g.restore(); };
const ground = (y = 1500) => { setTimeout(() => 0, 0); g.fillStyle = lin(0, y, 0, y + 900, [[0, '#141026'], [1, '#08060f']]); g.fillRect(-1400, y, 4000, 1600);
  g.strokeStyle = 'rgba(80,120,90,0.25)'; g.lineWidth = 4; for (let k = 0; k < 120; k++) { const x = -1300 + (k * 97) % 3800, yy = y + 20 + (k * 53) % 500; g.beginPath(); g.moveTo(x, yy); g.lineTo(x - 6, yy - 18); g.moveTo(x + 6, yy); g.lineTo(x + 10, yy - 16); g.stroke(); } };
const fog = (y = 1500) => { g.save(); for (let k = 0; k < 5; k++) { const x = ((T * (18 + k * 6) + k * 520) % 3200) - 1400; g.fillStyle = 'rgba(170,160,220,0.06)'; g.beginPath(); g.ellipse(x, y - 30 + k * 26, 520, 70, 0, 0, 7); g.fill(); }
  g.fillStyle = 'rgba(230,225,255,0.35)'; for (let k = 0; k < 26; k++) { const px = ((k * 397 + T * (12 + k % 5 * 4)) % 2400) - 600, py = 700 + ((k * 211 + T * (8 + k % 3 * 3)) % 900); g.fillRect(px, py, 3, 3); } g.restore(); };
const fence = (x0, x1, y) => { g.fillStyle = '#2a2036'; g.strokeStyle = '#121018'; g.lineWidth = 6; for (let x = x0; x < x1; x += 70) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - 170); g.lineTo(x + 25, y - 200); g.lineTo(x + 50, y - 170); g.lineTo(x + 50, y); g.closePath(); g.fill(); g.stroke(); } g.fillRect(x0, y - 140, x1 - x0, 18); g.fillRect(x0, y - 60, x1 - x0, 18); };
// our house, back side: wall, back door, two windows (lit=0 dark)
const ourHouse = (x, y, o = {}) => { // y = ground line
  g.fillStyle = '#1c1530'; g.fillRect(x, y - 900, 700, 900); g.fillStyle = '#120e22'; g.beginPath(); g.moveTo(x - 40, y - 900); g.lineTo(x + 350, y - 1180); g.lineTo(x + 740, y - 900); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.03)'; for (let k = 0; k < 20; k++) g.fillRect(x, y - 900 + k * 45, 700, 4);
  const win = (wx, wy, lit) => { rr(wx - 10, wy - 10, 160, 200, 6, '#0c0a18'); g.fillStyle = lit ? '#ffd27a' : '#16122c'; g.fillRect(wx, wy, 140, 180); g.fillStyle = '#0c0a18'; g.fillRect(wx + 66, wy, 8, 180); g.fillRect(wx, wy + 86, 140, 8); };
  win(x + 80, y - 760, o.win1); win(x + 470, y - 760, o.win2);
  // back door
  const dx = x + 260, dw = 190, dh = 420, open = o.open || 0;
  rr(dx - 14, y - dh - 14, dw + 28, dh + 14, 6, '#2a1e44');
  g.fillStyle = '#05040a'; g.fillRect(dx, y - dh, dw, dh); // dark opening behind
  g.save(); g.translate(dx, y - dh); g.scale(1 - 0.8 * open, 1); rr(0, 0, dw, dh, 4, '#3c2e62'); g.fillStyle = 'rgba(0,0,0,0.15)'; g.fillRect(22, 30, dw - 44, 150); g.fillRect(22, 210, dw - 44, 180);
  g.fillStyle = '#c8b070'; g.beginPath(); g.arc(dw - 26, 230, 11, 0, 7); g.fill(); g.restore();
  // steps
  rr(dx - 40, y - 10, dw + 80, 30, 4, '#241a3a');
};
// Mrs. Hale's house (lit), front-on, with back door at its left side
const haleHouse = (x, y, o = {}) => { const lit = o.lit ?? 1;
  g.fillStyle = '#231a36'; g.fillRect(x, y - 760, 640, 760); g.fillStyle = '#17112a'; g.beginPath(); g.moveTo(x - 30, y - 760); g.lineTo(x + 320, y - 1000); g.lineTo(x + 670, y - 760); g.fill();
  const win = (wx, wy) => { rr(wx - 10, wy - 10, 170, 210, 6, '#0c0a18'); g.fillStyle = lit ? '#ffcf7a' : '#16122c'; g.fillRect(wx, wy, 150, 190);
    if (lit) { g.fillStyle = 'rgba(200,120,90,0.35)'; g.fillRect(wx, wy, 34, 190); g.fillRect(wx + 116, wy, 34, 190); } g.fillStyle = '#0c0a18'; g.fillRect(wx + 71, wy, 8, 190); g.fillRect(wx, wy + 90, 150, 8);
    if (lit) add(() => { const r = g.createRadialGradient(wx + 75, wy + 95, 10, wx + 75, wy + 95, 320); r.addColorStop(0, 'rgba(255,200,120,0.28)'); r.addColorStop(1, 'rgba(255,200,120,0)'); g.fillStyle = r; g.fillRect(wx - 300, wy - 300, 750, 800); }); };
  win(x + 330, y - 620); win(x + 330, y - 340);
  if (o.shadow) { g.fillStyle = `rgba(30,18,30,${0.7 * o.shadow})`; g.beginPath(); g.ellipse(x + 330 + 40 + 70 * o.shadowX, y - 560, 26, 60, 0, 0, 7); g.fill(); g.beginPath(); g.arc(x + 330 + 40 + 70 * o.shadowX, y - 600, 20, 0, 7); g.fill(); }
  // back door (left)
  const dx = x + 70, dw = 180, dh = 400, open = o.open ?? 0;
  rr(dx - 14, y - dh - 14, dw + 28, dh + 14, 6, '#2a1e44');
  g.fillStyle = '#ffcf7a'; g.fillRect(dx, y - dh, dw, dh);
  add(() => { g.fillStyle = lin(0, y, 0, y + 260, [[0, `rgba(255,200,120,${0.45 * open})`], [1, 'rgba(255,200,120,0)']]); g.beginPath(); g.moveTo(dx, y); g.lineTo(dx + dw, y); g.lineTo(dx + dw + 160, y + 260); g.lineTo(dx - 160, y + 260); g.fill(); });
  g.save(); g.translate(dx, y - dh); g.scale(1 - 0.85 * open, 1); rr(0, 0, dw, dh, 4, '#4a3a6a'); g.fillStyle = 'rgba(0,0,0,0.15)'; g.fillRect(20, 28, dw - 40, 140); g.fillRect(20, 200, dw - 40, 170); g.restore();
  rr(dx - 40, y - 10, dw + 80, 30, 4, '#2a2040');
  // overgrown yard tufts
  g.fillStyle = '#0d1410'; for (let k = 0; k < 14; k++) { const tx = x - 40 + k * 52, th = 40 + (k * 29) % 50; g.beginPath(); g.moveTo(tx, y + 10); g.lineTo(tx + 10, y - th); g.lineTo(tx + 22, y + 10); g.fill(); }
};
const streetDark = (x, y) => { for (const [dx, w, h] of [[-900, 360, 520], [-480, 300, 460], [1300, 380, 540], [1720, 320, 480]]) { g.fillStyle = '#0c0a18'; g.fillRect(x + dx, y - h, w, h); g.beginPath(); g.moveTo(x + dx - 20, y - h); g.lineTo(x + dx + w / 2, y - h - 140); g.lineTo(x + dx + w + 20, y - h); g.fill(); g.fillStyle = '#141028'; g.fillRect(x + dx + 60, y - h + 120, 60, 80); g.fillRect(x + dx + w - 120, y - h + 120, 60, 80); } };

// ---- Part 1 bedroom (same opening as Part 1) ----
const wallIn = (top = '#1a1236', bot = '#2a1e4e') => { g.fillStyle = lin(0, 0, 0, 1500, [[0, top], [1, bot]]); g.fillRect(-1400, -900, 4000, 3600); g.fillStyle = 'rgba(255,255,255,0.025)'; for (let x = -1400; x < 2600; x += 90) g.fillRect(x, -900, 40, 3200); };
const floorIn = (y = 1300, a = '#231838', b = '#100a1c') => { g.fillStyle = lin(0, y, 0, y + 800, [[0, a], [1, b]]); g.fillRect(-1400, y, 4000, 1600); g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(-1400, y, 4000, 14); g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = 4; for (let k = 1; k < 7; k++) { g.beginPath(); g.moveTo(-1400, y + k * k * 18); g.lineTo(2600, y + k * k * 18); g.stroke(); } };
const door = (x, y, w, h, o = {}) => { // o: shake, glow (0..1), glowCol, feet (0..1), big (0..1), knob ('L'|'R')
  const sh = o.shake || 0, gc = o.glowCol || '170,190,255';
  g.save(); g.translate(sh * 7, 0);
  rr(x - 20, y - 20, w + 40, h + 20, 8, '#2a1e44'); rr(x, y, w, h, 6, o.col || '#3c2e62');
  g.fillStyle = 'rgba(0,0,0,0.14)'; g.fillRect(x + 30, y + 40, w - 60, h * 0.36); g.fillRect(x + 30, y + h * 0.48, w - 60, h * 0.44);
  g.fillStyle = '#c8b070'; g.beginPath(); g.arc(o.knob === 'R' ? x + w - 34 : x + 34, y + h * 0.52, 14, 0, 7); g.fill();
  if (o.peep !== false) { g.fillStyle = '#0c0a14'; g.beginPath(); g.arc(x + w / 2, y + h * 0.3, 9, 0, 7); g.fill(); }
  g.restore();
  const gl = o.glow ?? 1;
  if (gl > 0) {
    g.fillStyle = `rgba(${gc},${0.9 * gl})`; g.fillRect(x, y + h - 6, w, 7);
    // shadows of what stands outside, cut out of the light strip
    if (o.feet) { g.fillStyle = `rgba(6,4,14,${o.feet})`; for (const fx of [0.36, 0.58]) g.fillRect(x + w * fx, y + h - 7, w * 0.11, 8); }
    add(() => { g.fillStyle = lin(0, y + h, 0, y + h + 150, [[0, `rgba(${gc},${0.38 * gl})`], [1, `rgba(${gc},0)`]]); g.beginPath(); g.moveTo(x, y + h); g.lineTo(x + w, y + h); g.lineTo(x + w + 90, y + h + 150); g.lineTo(x - 90, y + h + 150); g.closePath(); g.fill(); });
    if (o.feet) { g.fillStyle = `rgba(6,4,14,${0.7 * o.feet})`; for (const fx of [0.36, 0.58]) { g.beginPath(); g.moveTo(x + w * fx, y + h); g.lineTo(x + w * (fx + 0.11), y + h); g.lineTo(x + w * (fx + 0.11) + 40, y + h + 150); g.lineTo(x + w * fx - 30, y + h + 150); g.closePath(); g.fill(); } }
    if (o.big) { g.fillStyle = `rgba(6,4,14,${0.85 * o.big})`; g.fillRect(x + w * 0.12, y + h - 7, w * 0.8 * o.big, 8); g.beginPath(); g.moveTo(x + w * 0.12, y + h); g.lineTo(x + w * (0.12 + 0.8 * o.big), y + h); g.lineTo(x + w * (0.12 + 0.8 * o.big) + 80, y + h + 150); g.lineTo(x + w * 0.12 - 70, y + h + 150); g.closePath(); g.fill(); }
  }
};
const clock = (x, y, txt, on = true, blinkT = 0) => { rr(x - 75, y - 52, 150, 70, 10, '#0a0610'); const b = Math.floor(blinkT * 2) % 2 === 0; g.fillStyle = on ? (b ? '#ff2a3a' : '#8a1420') : '#2a0a10'; g.shadowColor = '#ff2a3a'; g.shadowBlur = on && b ? 22 : 4; g.font = '700 50px "DejaVu Sans Mono", monospace'; g.textAlign = 'center'; g.fillText(txt, x, y); g.shadowBlur = 0; g.textAlign = 'left'; };
const bedroomBase = (o = {}) => {
  wallIn(); floorIn();
  rr(600, 380, 330, 430, 10, '#0c0a1c'); g.fillStyle = lin(600, 380, 930, 810, [[0, '#3a3a7a'], [1, '#141038']]); g.fillRect(612, 392, 306, 406);
  g.fillStyle = '#e8e6ff'; g.beginPath(); g.arc(840, 470, 38, 0, 7); g.fill(); g.fillStyle = '#3a3a7a'; g.beginPath(); g.arc(856, 460, 34, 0, 7); g.fill();
  g.fillStyle = '#0c0a1c'; g.fillRect(760, 392, 10, 406); g.fillRect(612, 590, 306, 10);
  for (const [x, w] of [[560, 90], [880, 90]]) { g.fillStyle = lin(x, 0, x + w, 0, [[0, '#2e2050'], [0.5, '#3e2c68'], [1, '#261a44']]); g.fillRect(x, 340, w, 560); }
  add(() => { g.fillStyle = lin(700, 800, 500, 1500, [[0, 'rgba(150,140,255,0.22)'], [1, 'rgba(150,140,255,0)']]); g.beginPath(); g.moveTo(620, 800); g.lineTo(920, 800); g.lineTo(760, 1650); g.lineTo(260, 1650); g.closePath(); g.fill(); });
  door(1000, 560, 240, 760, { shake: o.shake || 0, glow: o.doorGlow ?? 0, peep: false });
  rr(60, 1080, 220, 230, 12, '#24183c'); clock(175, 1062, o.clockTxt || '3:33', o.clockOn !== false, o.t || 0);
  if (o.lamp) { rr(200, 930, 50, 80, 8, '#3a2c58'); add(() => { const r = g.createRadialGradient(225, 930, 10, 225, 930, 360); r.addColorStop(0, `rgba(255,210,140,${0.5 * o.lamp})`); r.addColorStop(1, 'rgba(255,210,140,0)'); g.fillStyle = r; g.fillRect(-200, 500, 900, 900); }); }
  rr(260, 880, 640, 120, 30, '#33245a'); rr(300, 1040, 200, 80, 30, '#8a82c8');
};
const bedFront = (knee = 0) => {
  rr(270, 1090, 700, 230, 24, '#3c2a6a'); rr(262, 1290, 716, 150, 10, '#20163a'); for (const lx of [280, 940]) rr(lx, 1420, 26, 60, 4, '#160f28');
  g.fillStyle = lin(0, 1110, 0, 1330, [[0, '#6a54b8'], [1, '#3e2c78']]); g.beginPath(); g.moveTo(290, 1150); g.lineTo(470, 1146); g.quadraticCurveTo(560, 1146 - 90 * knee, 650, 1146 - 70 * knee); g.quadraticCurveTo(720, 1146 - 40 * knee, 790, 1140); g.quadraticCurveTo(900, 1136, 980, 1140); g.lineTo(980, 1330); g.lineTo(290, 1330); g.closePath(); g.fill();
  if (knee > 0) { g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 6; g.beginPath(); g.moveTo(480, 1140); g.quadraticCurveTo(560, 1146 - 86 * knee, 645, 1150 - 70 * knee); g.stroke(); }
  g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 6; for (const x of [520, 690, 840]) { g.beginPath(); g.moveTo(x, 1135); g.quadraticCurveTo(x + 30, 1230, x + 10, 1325); g.stroke(); }
};
const rug = () => { g.fillStyle = 'rgba(80,60,140,0.45)'; g.beginPath(); g.ellipse(560, 1640, 380, 90, 0, 0, 7); g.fill(); g.setLineDash([26, 18]); g.strokeStyle = 'rgba(160,140,230,0.45)'; g.lineWidth = 6; g.beginPath(); g.ellipse(560, 1640, 340, 72, 0, 0, 7); g.stroke(); g.setLineDash([]); };

// ---------- Part 3 set pieces: inside the woods ----------
const forest = (scroll = 0, o = {}) => { // layered trunks; scroll moves them sideways (running = parallax)
  g.fillStyle = lin(0, -400, 0, 1700, [[0, '#07061a'], [1, '#17123a']]); g.fillRect(-1400, -900, 4000, 3600);
  g.fillStyle = 'rgba(200,190,255,0.06)'; g.fillRect(-1400, 900, 4000, 500); // mist band
  const layer = (n, w, col, speed, y0, h0, sw) => { for (let k = 0; k < n; k++) { let x = ((k * 2600 / n - scroll * speed) % 2600 + 2600) % 2600 - 800; const ww = w * (0.8 + (k * 37 % 5) / 10), s = Math.sin(T * 0.9 + k) * sw;
    g.fillStyle = col; g.beginPath(); g.moveTo(x - ww / 2, y0 + 1200); g.lineTo(x - ww / 2 + s * 0.3, y0 - h0); g.lineTo(x + ww / 2 + s * 0.3, y0 - h0); g.lineTo(x + ww / 2, y0 + 1200); g.fill();
    if (o.branches !== false) { g.strokeStyle = col; g.lineWidth = ww * 0.18; g.beginPath(); g.moveTo(x, y0 - h0 * 0.4); g.lineTo(x + (k % 2 ? 1 : -1) * ww * 2.2 + s, y0 - h0 * 0.62); g.stroke(); } } };
  layer(16, 34, '#100c26', 0.25, 1200, 1500, 4); fog(1350);
  layer(10, 70, '#0b081c', 0.55, 1350, 1700, 6);
  for (let k = 0; k < 10; k++) { const x = ((k * 260 - scroll * 0.55) % 2600 + 2600) % 2600 - 800; g.strokeStyle = 'rgba(120,110,170,0.08)'; g.lineWidth = 3; for (let j = 0; j < 6; j++) { g.beginPath(); g.moveTo(x - 20 + j * 8, 400 + j * 160); g.lineTo(x - 16 + j * 8, 520 + j * 160); g.stroke(); }
    g.fillStyle = '#0a0718'; for (let j = 0; j < 4; j++) { g.beginPath(); g.ellipse(x + (j % 2 ? 90 : -90) + Math.sin(T + k + j) * 6, 120 + j * 110, 110, 46, 0, 0, 7); g.fill(); } }
  g.fillStyle = lin(0, 1450, 0, 2200, [[0, '#120e22'], [1, '#05040a']]); g.fillRect(-1400, 1450, 4000, 1400);
  g.fillStyle = '#0d0a1a'; for (let k = 0; k < 40; k++) { const x = ((k * 97 - scroll * 1.0) % 2600 + 2600) % 2600 - 800; g.beginPath(); g.ellipse(x, 1470 + (k * 13) % 40, 30 + k % 4 * 10, 10, 0, 0, 7); g.fill(); } // leaves/roots
};
const fgTrunks = (scroll = 0) => { for (let k = 0; k < 3; k++) { let x = ((k * 1100 - scroll * 1.6) % 3300 + 3300) % 3300 - 900; g.fillStyle = '#040309'; g.fillRect(x, -900, 150, 3600); } };
const fallenTree = (x, y, w = 1300) => { g.fillStyle = '#2a1e3a'; g.strokeStyle = '#08060f'; g.lineWidth = 10; g.beginPath(); g.roundRect(x, y - 190, w, 190, 90); g.fill(); g.stroke();
  g.strokeStyle = 'rgba(190,170,240,0.22)'; g.lineWidth = 8; g.beginPath(); g.moveTo(x + 90, y - 180); g.lineTo(x + w - 90, y - 180); g.stroke(); // moonlight on the top of the log
  g.fillStyle = '#2f4a2e'; for (let k = 0; k < 6; k++) { g.beginPath(); g.ellipse(x + 160 + k * 210, y - 186, 46, 14, 0, 0, 7); g.fill(); } // moss
