<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="2560" height="1440"></canvas>
<script type="module">
// General channel banner 2560x1440, no text: our character at a fork. Left = horror (dark woods, eyes, a house with one lit window),
// right = apocalypse (ruined city, red sky). Two glowing paths = the choice. Key art inside the 1546x423 safe area.
import { whiteStick } from './stick.js';
const cv = document.getElementById('c'), g = cv.getContext('2d'), W = 2560, H = 1440, CX = 1280, GY = 900;
const lin = (x0, y0, x1, y1, st) => { const q = g.createLinearGradient(x0, y0, x1, y1); st.forEach(([o, c]) => q.addColorStop(o, c)); return q; };
// sky: purple left, blood red right
g.fillStyle = lin(0, 0, W, 0, [[0, '#120c2a'], [0.45, '#241a4c'], [0.6, '#2a1638'], [1, '#3a0e1c']]); g.fillRect(0, 0, W, H);
g.fillStyle = lin(0, 300, 0, GY, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(255,90,60,0.12)']]); g.fillRect(CX, 300, W - CX, GY - 300);
// moon (centre, above him)
g.fillStyle = '#e8e6ff'; g.beginPath(); g.arc(CX, 570, 44, 0, 7); g.fill(); g.fillStyle = '#251a4a'; g.beginPath(); g.arc(CX + 17, 556, 40, 0, 7); g.fill();
// LEFT: woods + house
const tree = (x, h, w) => { g.fillStyle = '#0a0716'; g.fillRect(x - 8, GY - h, 16, h); for (let k = 0; k < 4; k++) { const y = GY - h + k * h * 0.22; g.beginPath(); g.moveTo(x, y - 60); g.lineTo(x - w * (0.5 + k * 0.18), y + 70); g.lineTo(x + w * (0.5 + k * 0.18), y + 70); g.fill(); } };
g.fillStyle = '#0d0a1e'; g.beginPath(); g.moveTo(0, GY - 120); for (let x = 0; x <= CX - 200; x += 80) g.lineTo(x, GY - 120 - 30 * Math.sin(x * 0.01)); g.lineTo(CX - 200, GY); g.lineTo(0, GY); g.fill();
[[560, 330, 70], [660, 260, 60], [760, 380, 80], [1040, 300, 66], [1130, 230, 52], [420, 280, 60], [300, 360, 80], [180, 300, 70]].forEach(([x, h, w]) => tree(x, h, w));
g.fillStyle = '#0a0716'; g.fillRect(830, GY - 210, 170, 210); g.beginPath(); g.moveTo(815, GY - 210); g.lineTo(915, GY - 300); g.lineTo(1015, GY - 210); g.fill(); g.fillRect(960, GY - 290, 22, 60);
g.save(); g.shadowColor = '#ffcf7a'; g.shadowBlur = 24; g.fillStyle = '#ffcf7a'; g.fillRect(870, GY - 170, 34, 42); g.restore(); g.fillStyle = '#0a0716'; g.fillRect(885, GY - 170, 4, 42); g.fillRect(870, GY - 151, 34, 4);
g.save(); g.shadowColor = 'rgba(255,255,255,0.9)'; g.shadowBlur = 14; g.fillStyle = '#f4f2ee'; for (const [x, y] of [[620, GY - 60], [1090, GY - 90]]) for (const s of [-1, 1]) { g.beginPath(); g.ellipse(x + s * 9, y, 5, 7, 0, 0, 7); g.fill(); } g.restore();
// RIGHT: ruined city
const bld = [[1420, 230, 110], [1540, 330, 90], [1640, 260, 120], [1770, 380, 100], [1880, 290, 130], [2020, 350, 90], [2120, 250, 120], [2250, 310, 110], [2370, 220, 130]];
bld.forEach(([x, h, w], i) => { g.fillStyle = '#100810'; g.beginPath(); g.moveTo(x, GY); g.lineTo(x, GY - h); const n = 4; for (let k = 1; k <= n; k++) g.lineTo(x + (w * k) / n, GY - h + (k % 2 ? 26 + (i % 3) * 10 : -8)); g.lineTo(x + w, GY); g.fill();
  for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) if ((r * 7 + c * 3 + i) % 5 === 0) { g.fillStyle = 'rgba(255,120,80,0.55)'; g.fillRect(x + 16 + c * (w / 3.4), GY - h + 50 + r * 46, 14, 20); } });
for (const [x, y, r] of [[1700, GY - 300, 60], [2100, GY - 330, 80], [1950, GY - 380, 50]]) { g.fillStyle = 'rgba(30,20,30,0.55)'; g.beginPath(); g.arc(x, y, r, 0, 7); g.arc(x + r * 0.8, y - r * 0.5, r * 0.8, 0, 7); g.arc(x + r * 1.6, y - r * 0.2, r * 0.7, 0, 7); g.fill(); } // smoke
// ground
g.fillStyle = lin(0, GY, 0, H, [[0, '#0c0818'], [1, '#05030a']]); g.fillRect(0, GY, W, H - GY);
// two glowing paths from his feet toward the viewer: left lime, right red
for (const [s, c] of [[-1, '198,255,58'], [1, '255,77,94']]) { g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = lin(CX, GY, CX + s * 500, H, [[0, `rgba(${c},0.75)`], [0.5, `rgba(${c},0.25)`], [1, `rgba(${c},0)`]]);
  g.beginPath(); g.moveTo(CX + s * 6, GY + 4); g.lineTo(CX + s * 46, GY + 4); g.lineTo(CX + s * 900, H); g.lineTo(CX + s * 420, H); g.closePath(); g.fill(); g.restore(); }
// our character in the middle, at the fork
g.fillStyle = 'rgba(0,0,0,0.45)'; g.beginPath(); g.ellipse(CX, GY + 10, 70, 10, 0, 0, 7); g.fill();
g.save(); g.translate(CX - 300 * 0.4, GY + 6 - 975 * 0.4); g.scale(0.4, 0.4); whiteStick({ g }, { beanie: '#2a2a36', expr: 'worried', look: 0 }); g.restore();
const v = g.createRadialGradient(CX, 720, 600, CX, 720, 1500); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.65)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
window.ready = true;
</script></body></html>
