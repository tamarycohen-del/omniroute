<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// KD vs the planet-eater — high-energy 2D action animation, every frame drawn in code (canvas 2D).
// Skeleton-rigged KD (Golden State colours, #35), original cosmic-giant design (no copied costume), VFX: speed lines,
// afterimages, impact frames, shockwaves, particles, comet trails, camera shake, slow motion.
const cv = document.getElementById('c'), g = cv.getContext('2d'), W = 1080, H = 1920;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), sm = (x) => { x = clamp(x); return x * x * (3 - 2 * x); }, lerp = (a, b, u) => a + (b - a) * u;
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3), easeIn = (x) => Math.pow(clamp(x), 3), back = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
let T = 0, WORDS = [];
const C = { blue: '#1d428a', blue2: '#14306a', gold: '#ffc72c', skin: '#6e4128', skinL: '#8a5636', white: '#f4f1ea', red: '#ff3b30', violet: '#3a2f52', violet2: '#1c1528', violetL: '#9b86c9', glowV: '150,110,255', ink: '#04050b', orange: '#ff7a1a', ice: '#9ee7ff' };
const font = (s, w = 900, it = 'italic ') => `${it}${w} ${s}px "DejaVu Sans", sans-serif`;
const txt = (s, x, y, size, col = C.white, o = {}) => { g.save(); g.font = font(size); g.textAlign = o.align || 'center'; g.lineJoin = 'round'; let fs = size; while (g.measureText(s).width > (o.maxW || 980)) { fs -= 4; g.font = font(fs); }
  if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = 40; } g.lineWidth = o.stroke || 16; g.strokeStyle = '#000'; g.strokeText(s, x, y); g.shadowBlur = 0; g.fillStyle = col; g.fillText(s, x, y); g.restore(); };
const slam = (s, x, y, size, col, u, o = {}) => { if (u <= 0) return; const k = back(u / 0.25); g.save(); g.translate(x, y); g.scale(lerp(2.4, 1, clamp(k)), lerp(2.4, 1, clamp(k))); g.rotate((o.rot || -0.04) * (1 - clamp(u / 0.25))); g.globalAlpha = clamp(u / 0.12); txt(s, 0, 0, size, col, o); g.restore(); };
const glow = (x, y, r, col, a) => { if (r <= 0) return; g.save(); g.globalCompositeOperation = 'lighter'; const rg = g.createRadialGradient(x, y, 1, x, y, r); rg.addColorStop(0, `rgba(${col},${a})`); rg.addColorStop(1, `rgba(${col},0)`); g.fillStyle = rg; g.fillRect(x - r, y - r, 2 * r, 2 * r); g.restore(); };
const cam = (z, fx, fy, rot = 0) => { g.translate(W / 2, H / 2); g.rotate(rot); g.scale(z, z); g.translate(-fx, -fy); };
let SHK = 0; const shake = (a) => { g.translate((hash(Math.floor(T * 30)) - 0.5) * a * 2, (hash(Math.floor(T * 30) + 7) - 0.5) * a * 2); };

// ---------- environment ----------
const nebula = (dx = 0, dy = 0) => { const q = g.createLinearGradient(0, -1200, 0, 3000); q.addColorStop(0, '#05061a'); q.addColorStop(0.5, '#140b3a'); q.addColorStop(1, '#070818'); g.fillStyle = q; g.fillRect(-3000, -3000, 8000, 9000);
  for (let i = 0; i < 7; i++) glow(hash(i) * 1600 - 260 + dx * 0.3, hash(i + 3) * 2600 - 400 + dy * 0.3, 500 + hash(i + 7) * 500, ['120,60,255', '30,140,255', '255,60,160', '40,220,200'][i % 4], 0.16);
  for (let l = 0; l < 3; l++) for (let i = 0; i < 140; i++) { const k = l * 0.35 + 0.2, x = ((hash(i + l * 300) * 2600 - 760 + dx * k) % 2600 + 2600) % 2600 - 760, y = ((hash(i + 5 + l * 300) * 3800 - 900 + dy * k) % 3800 + 3800) % 3800 - 900, r = (1 + l) * (0.8 + hash(i + 9) * 1.4); g.fillStyle = `rgba(255,255,255,${(0.35 + 0.65 * Math.abs(Math.sin(T * 1.7 + i))) * (0.4 + l * 0.3)})`; g.fillRect(x, y, r, r); } };
const planet = (x, y, r, a = 1) => { if (r < 3) return; g.save(); g.globalAlpha = a; const q = g.createRadialGradient(x - r * 0.35, y - r * 0.45, r * 0.05, x, y, r); q.addColorStop(0, '#5fc4a8'); q.addColorStop(0.5, '#1f6b5c'); q.addColorStop(1, '#071d1b'); g.fillStyle = q; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.save(); g.clip(); g.strokeStyle = 'rgba(180,255,230,0.12)'; g.lineWidth = r * 0.05; for (let i = 0; i < 6; i++) { g.beginPath(); g.ellipse(x, y - r + i * r * 0.36, r * 1.1, r * 0.08, 0.1, 0, 7); g.stroke(); } g.restore();
  g.strokeStyle = 'rgba(140,255,225,0.6)'; g.lineWidth = r * 0.02; g.beginPath(); g.arc(x, y, r, Math.PI * 1.05, Math.PI * 1.95); g.stroke(); glow(x, y, r * 1.3, '80,230,200', 0.2); g.restore(); };
const court = (x, y, w, o = {}) => { g.save(); g.translate(x, y); const h = w * 0.2; const q = g.createLinearGradient(0, -h, 0, 0); q.addColorStop(0, '#9b6234'); q.addColorStop(1, '#d99a5c'); g.fillStyle = q; g.beginPath(); g.moveTo(-w / 2, 0); g.lineTo(w / 2, 0); g.lineTo(w / 2 - w * 0.1, -h); g.lineTo(-w / 2 + w * 0.1, -h); g.closePath(); g.fill();
  g.save(); g.clip(); g.strokeStyle = 'rgba(80,40,10,0.25)'; g.lineWidth = 3; for (let i = -20; i < 20; i++) { g.beginPath(); g.moveTo(i * w * 0.05, 0); g.lineTo(i * w * 0.04, -h); g.stroke(); } glow(0, -h * 0.4, w * 0.4, '255,220,160', 0.25); g.restore();
  g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = Math.max(2, w * 0.004); g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -h); g.stroke(); g.beginPath(); g.ellipse(0, -h / 2, w * 0.07, h * 0.2, 0, 0, 7); g.stroke();
  g.fillStyle = C.blue; g.fillRect(-w / 2, 0, w, w * 0.02); g.fillStyle = C.gold; g.fillRect(-w / 2, w * 0.02, w, w * 0.008); glow(0, w * 0.03, w * 0.6, '255,199,44', 0.12);
  if (o.crack) { g.strokeStyle = '#000'; g.lineWidth = w * 0.006; g.beginPath(); g.moveTo(-w * 0.2, -h); g.lineTo(-w * 0.05, -h * 0.4); g.lineTo(-w * 0.15, 0); g.moveTo(w * 0.1, -h); g.lineTo(w * 0.2, -h * 0.5); g.stroke(); } g.restore(); };
// real scale: KD is ~900 units tall at scale 1 (6'11"), so 1 ft ≈ 130 units → rim at 10 ft = 1300 units. Side view. Returns rim centre.
const hoop = (x, gy, ks, net = 9) => { if (!(net >= 0)) net = 9; g.save(); g.translate(x, gy); g.scale(ks, ks); const rimY = -1300; g.fillStyle = '#c9ced8'; g.fillRect(-16, -1560, 32, 1560); g.fillStyle = '#9aa2b0'; g.fillRect(-70, -12, 140, 24); g.fillRect(-120, -1500, 120, 22);
  g.fillStyle = 'rgba(230,240,255,0.6)'; g.fillRect(-140, -1560, 22, 460); g.strokeStyle = '#fff'; g.lineWidth = 6; g.strokeRect(-140, -1560, 22, 460);
  g.strokeStyle = C.orange; g.lineWidth = 12; g.beginPath(); g.ellipse(-240, rimY, 100, 22, 0, 0, 7); g.stroke(); g.lineWidth = 8; g.beginPath(); g.moveTo(-140, rimY); g.lineTo(-150, rimY); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 4; const sw = Math.sin(net * 22) * 22 * Math.exp(-net * 3); for (let k = 0; k <= 8; k++) { const a = -340 + k * 25; g.beginPath(); g.moveTo(a, rimY + 4); g.lineTo(-270 + k * 15 + sw, rimY + 190); g.stroke(); } g.beginPath(); g.moveTo(-275 + sw, rimY + 120); g.lineTo(-195 + sw, rimY + 120); g.stroke();
  if (net < 0.4) glow(-240, rimY + 60, 400, '255,199,44', 0.6 * (1 - net / 0.4)); g.restore(); return [x - 240 * ks, gy + rimY * ks]; };
const ball = (x, y, r, spin = 0) => { g.save(); g.translate(x, y); g.rotate(spin); const q = g.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r); q.addColorStop(0, '#ffab5c'); q.addColorStop(1, '#c9500a'); g.fillStyle = q; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.strokeStyle = '#2a1205'; g.lineWidth = r * 0.09; g.beginPath(); g.moveTo(-r, 0); g.lineTo(r, 0); g.moveTo(0, -r); g.lineTo(0, r); g.stroke(); g.beginPath(); g.arc(-r * 1.25, 0, r * 0.9, -0.9, 0.9); g.stroke(); g.beginPath(); g.arc(r * 1.25, 0, r * 0.9, Math.PI - 0.9, Math.PI + 0.9); g.stroke(); g.restore(); };
const comet = (pts, r) => { for (let i = 0; i < pts.length - 1; i++) { const k = i / pts.length; g.strokeStyle = `rgba(255,${150 + 80 * k},60,${k * 0.8})`; g.lineWidth = r * 2 * k; g.lineCap = 'round'; g.beginPath(); g.moveTo(...pts[i]); g.lineTo(...pts[i + 1]); g.stroke(); } const p = pts[pts.length - 1]; glow(p[0], p[1], r * 5, '255,170,60', 0.7); };


// ---------- painterly smoke texture (fbm value noise, generated once) ----------
const CLOUD = (() => { const n = 384, c = document.createElement('canvas'); c.width = c.height = n; const x = c.getContext('2d'), im = x.createImageData(n, n);
  const r = (i, j) => { const v = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return v - Math.floor(v); }; const sm2 = (t) => t * t * (3 - 2 * t);
  const vn = (px, py) => { const i = Math.floor(px), j = Math.floor(py), fx = sm2(px - i), fy = sm2(py - j); const a = r(i, j), b = r(i + 1, j), c2 = r(i, j + 1), d = r(i + 1, j + 1); return a + (b - a) * fx + (c2 - a) * fy + (a - b - c2 + d) * fx * fy; };
  for (let yy = 0; yy < n; yy++) for (let xx = 0; xx < n; xx++) { let v = 0, amp = 0.55, f = 4 / n; for (let o = 0; o < 6; o++) { v += vn(xx * f, yy * f) * amp; f *= 2; amp *= 0.5; } const dx = xx / n - 0.5, dy = yy / n - 0.5, fall = Math.max(0, 1 - Math.sqrt(dx * dx + dy * dy) * 2); const a = Math.max(0, Math.min(1, (v - 0.38) * 2.2)) * fall; const k = (yy * n + xx) * 4; im.data[k] = 70 + v * 90; im.data[k + 1] = 55 + v * 70; im.data[k + 2] = 95 + v * 110; im.data[k + 3] = a * 255; }
  x.putImageData(im, 0, 0); return c; })();
const smoke = (cx, cy, w, h, a, rot = 0) => { g.save(); g.globalAlpha = a; g.translate(cx, cy); g.rotate(rot); g.drawImage(CLOUD, -w / 2, -h / 2, w, h); g.restore(); };

// ---------- VFX ----------
const speedLines = (cx, cy, a = 1, n = 70, col = '255,255,255') => { g.save(); g.globalAlpha = a; for (let i = 0; i < n; i++) { const ang = hash(i + Math.floor(T * 24) * 0.1) * Math.PI * 2, r0 = 380 + hash(i + 7) * 300, r1 = r0 + 500 + hash(i + 3) * 900; g.strokeStyle = `rgba(${col},${0.25 + hash(i) * 0.5})`; g.lineWidth = 2 + hash(i + 1) * 8; g.beginPath(); g.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0); g.lineTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1); g.stroke(); } g.restore(); };
const shock = (x, y, u, rMax = 900, col = '255,230,160') => { if (u <= 0 || u >= 1) return; g.save(); g.strokeStyle = `rgba(${col},${1 - u})`; g.lineWidth = 40 * (1 - u); g.beginPath(); g.arc(x, y, rMax * ease(u), 0, 7); g.stroke(); g.lineWidth = 12 * (1 - u); g.beginPath(); g.arc(x, y, rMax * 0.7 * ease(u), 0, 7); g.stroke(); g.restore(); };
const burst = (x, y, u, n = 60, col = '255,199,44', spread = 900) => { if (u <= 0 || u >= 1.5) return; for (let i = 0; i < n; i++) { const a = hash(i) * Math.PI * 2, d = spread * ease(u) * (0.3 + hash(i + 2) * 0.7); g.fillStyle = `rgba(${col},${clamp(1 - u)})`; g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, 4 + hash(i + 4) * 10, 0, 7); g.fill(); } };
const motes = (a = 1) => { for (let i = 0; i < 60; i++) { const x = (hash(i) * 1200 + T * 40 * (0.5 + hash(i + 1))) % 1200 - 60, y = (hash(i + 2) * 2000 - T * 60 * (0.3 + hash(i + 3))) % 2000; g.fillStyle = `rgba(190,170,255,${0.3 * a})`; g.beginPath(); g.arc(x, (y + 2000) % 2000, 2 + hash(i + 5) * 4, 0, 7); g.fill(); } };

// ---------- KD rig ----------
// pose = angles in radians measured from straight down; positive = towards +x (facing right)
const P = {
  stand:   { lean: 0.02, sh: [-0.12, 0.12], el: [0.12, -0.12], hip: [-0.1, 0.1], kn: [-0.06, -0.04], head: 0 },
  dribA:   { lean: 0.12, sh: [-0.45, 0.3], el: [-0.55, 0.3], hip: [0.45, -0.35], kn: [-0.65, -0.5], head: 0.05, ball: 0 },
  dribB:   { lean: 0.15, sh: [-0.5, 0.45], el: [-0.5, 0.15], hip: [0.5, -0.3], kn: [-0.7, -0.55], head: 0.05, ball: 1 },
  hesi:    { lean: 0.04, sh: [-0.65, 0.35], el: [-0.75, 0.45], hip: [0.25, -0.55], kn: [-0.35, -0.2], head: -0.05, ball: 0.5 },
  drive:   { lean: 0.3, sh: [-0.95, 0.75], el: [-0.45, 0.35], hip: [0.85, -0.55], kn: [-1.1, -0.2], head: 0.1, ball: 0.7 },
  load:    { lean: 0.08, sh: [-2.45, 2.45], el: [-1.25, 1.25], hip: [0.45, 0.15], kn: [-0.9, -0.75], head: -0.05 },
  shoot:   { lean: -0.04, sh: [-2.75, 3.05], el: [-0.85, 0.08], hip: [0.18, 0.02], kn: [-0.3, -0.12], head: -0.12 },
  follow:  { lean: -0.06, sh: [-2.6, 2.95], el: [-0.35, 0.75], hip: [0.22, 0.05], kn: [-0.45, -0.25], head: -0.15 },
  wing:    { lean: 0, sh: [-1.62, 1.62], el: [0, 0], hip: [-0.14, 0.14], kn: [0, 0], head: 0 },
  flex:    { lean: -0.05, sh: [-2.2, 2.2], el: [-1.6, 1.6], hip: [-0.2, 0.2], kn: [-0.1, -0.1], head: -0.1 },
  shrug:   { lean: 0, sh: [-0.9, 0.9], el: [1.3, -1.3], hip: [-0.1, 0.1], kn: [0, 0], head: 0.12 },
};
const mixP = (a, b, u) => { const o = {}; for (const k in a) o[k] = Array.isArray(a[k]) ? a[k].map((v, i) => lerp(v, b[k][i], u)) : lerp(a[k], b[k] ?? a[k], u); return o; };
const seg = (x1, y1, x2, y2, w1, w2, col, light = 1) => { const a = Math.atan2(y2 - y1, x2 - x1), nx = Math.sin(a), ny = -Math.cos(a); g.fillStyle = col; g.beginPath(); g.moveTo(x1 + nx * w1, y1 + ny * w1); g.lineTo(x2 + nx * w2, y2 + ny * w2); g.arc(x2, y2, w2, a - Math.PI / 2, a + Math.PI / 2); g.lineTo(x1 - nx * w1, y1 - ny * w1); g.arc(x1, y1, w1, a + Math.PI / 2, a + Math.PI * 1.5); g.fill();
  if (light) { g.save(); g.clip(); g.strokeStyle = `rgba(${C.glowV === undefined ? '150,110,255' : '170,130,255'},0.55)`; g.lineWidth = 5; g.beginPath(); g.moveTo(x1 - nx * w1, y1 - ny * w1); g.lineTo(x2 - nx * w2, y2 - ny * w2); g.stroke(); g.restore(); } };
const limb = (x, y, a1, l1, a2, l2, w) => { const ex = x + Math.sin(a1) * l1, ey = y + Math.cos(a1) * l1; const a = a1 + a2, hx = ex + Math.sin(a) * l2, hy = ey + Math.cos(a) * l2; return [ex, ey, hx, hy]; };
// smooth limb: one stroked path per bone (round caps/joins => no seams), muscle bulges, rim light on the far edge
const bone = (x1, y1, x2, y2, w, col) => { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
const rim = (x1, y1, x2, y2, w) => { const a = Math.atan2(y2 - y1, x2 - x1), nx = Math.sin(a) * w * 0.42, ny = -Math.cos(a) * w * 0.42; g.strokeStyle = 'rgba(185,150,255,0.45)'; g.lineWidth = 4; g.lineCap = 'round'; g.beginPath(); g.moveTo(x1 - nx, y1 - ny); g.lineTo(x2 - nx, y2 - ny); g.stroke(); };
const bulge = (x1, y1, x2, y2, t, w, col) => { const cx = lerp(x1, x2, t), cy = lerp(y1, y2, t), a = Math.atan2(y2 - y1, x2 - x1); g.fillStyle = col; g.beginPath(); g.ellipse(cx, cy, Math.hypot(x2 - x1, y2 - y1) * 0.28, w, a, 0, 7); g.fill(); };
const kd = (x, y, s, pose, o = {}) => { g.save(); g.translate(x, y - (o.jump || 0)); g.scale(s * (o.flip ? -1 : 1), s); const p = pose; const hipY = -440;
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(0, (o.jump || 0) / s, 120, 18, 0, 0, 7); g.fill();
  g.save(); g.translate(0, hipY);
  const L = (i) => limb(i ? 20 : -20, 0, p.hip[i], 215, p.kn[i], 215, 0);
  const leg = (i, back) => { const hx = i ? 20 : -20; const [kx, ky, fx, fy] = L(i); const sk = back ? '#4d2c19' : C.skin;
    bone(hx, 0, kx, ky, 54, sk); bone(kx, ky, fx, fy - 10, 38, sk); bulge(kx, ky, fx, fy, 0.3, 24, sk); if (!back) { rim(hx, 0, kx, ky, 54); rim(kx, ky, fx, fy, 38); }
    // sock + shoe (pointing forward = +x)
    g.fillStyle = back ? '#cfd3da' : '#f4f5f8'; g.beginPath(); g.ellipse(fx, fy - 26, 21, 22, 0, 0, 7); g.fill();
    g.fillStyle = back ? '#c9ccd3' : '#ffffff'; g.beginPath(); g.moveTo(fx - 30, fy - 12); g.quadraticCurveTo(fx - 34, fy + 12, fx - 22, fy + 14); g.lineTo(fx + 52, fy + 14); g.quadraticCurveTo(fx + 66, fy + 8, fx + 56, fy - 4); g.quadraticCurveTo(fx + 20, fy - 10, fx + 8, fy - 26); g.lineTo(fx - 24, fy - 26); g.closePath(); g.fill();
    g.fillStyle = back ? '#9aa1ad' : '#1d428a'; g.fillRect(fx - 28, fy + 8, 82, 7); g.fillStyle = C.gold; g.fillRect(fx + 2, fy - 10, 26, 6);
    return [kx, ky]; };
  const sleeve = (i, back) => { const hx = i ? 20 : -20; const [kx, ky] = L(i); const ex = lerp(hx, kx, 0.55), ey = lerp(0, ky, 0.55); bone(hx, -10, ex, ey, 86, C.gold); bone(hx, -10, lerp(hx, ex, 0.97), lerp(-10, ey, 0.97), 74, back ? C.blue2 : C.blue); };
  const torsoTop = [Math.sin(p.lean) * 300, -Math.cos(p.lean) * 300]; // same rotation as the jersey (g.rotate(lean))
  const shp = (sd) => [torsoTop[0] + sd * 56 * Math.cos(p.lean), torsoTop[1] + 18 + sd * 56 * Math.sin(p.lean)];
  const arm = (i, back) => { const sd = i ? 1 : -1; const [sx, sy] = shp(sd); const [ex, ey, hx, hy] = limb(sx, sy, p.sh[i], 205, p.el[i], 195, 0); const sk = back ? '#4d2c19' : C.skin;
    bone(sx, sy, ex, ey, 40, sk); bulge(sx, sy, ex, ey, 0.4, 25, sk); bone(ex, ey, hx, hy, 32, sk); bulge(ex, ey, hx, hy, 0.28, 19, sk); g.fillStyle = sk; g.beginPath(); g.arc(sx, sy, 30, 0, 7); g.fill(); if (!back) { rim(sx, sy, ex, ey, 40); rim(ex, ey, hx, hy, 32); }
    // wristband at the wrist, then the hand (palm + thumb) along the forearm
    const a = Math.atan2(hy - ey, hx - ex); const wx = lerp(ex, hx, 0.84), wy = lerp(ey, hy, 0.84); g.save(); g.translate(wx, wy); g.rotate(a); g.fillStyle = back ? '#c9ccd3' : '#fff'; g.fillRect(-12, -19, 24, 38); g.restore();
    g.save(); g.translate(hx, hy); g.rotate(a); g.fillStyle = sk; g.beginPath(); g.ellipse(22, 0, 30, 21, 0, 0, 7); g.fill(); g.beginPath(); g.ellipse(14, sd * -18 * (o.flip ? -1 : 1), 16, 8, -0.6, 0, 7); g.fill(); g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 3; for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(34, -10 + k * 10); g.lineTo(48, -10 + k * 10); g.stroke(); } g.restore();
    return [hx + Math.cos(a) * 26, hy + Math.sin(a) * 26]; };
  arm(0, true); leg(0, true); leg(1, false);
