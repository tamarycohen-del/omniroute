<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><script type="importmap">{"imports":{"three":"./package/build/three.module.js"}}</script><script type="module">
import * as THREE from './package/build/three.module.js';
import { RoundedBoxGeometry } from './package/examples/jsm/geometries/RoundedBoxGeometry.js';
const W = 1080, H = 1920;
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setSize(W, H); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
R.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(R.domElement); R.domElement.id = 'c';
const S = new THREE.Scene(); S.background = new THREE.Color('#8fd3ff'); S.fog = new THREE.Fog('#bfe6ff', 40, 120);
const cam = new THREE.PerspectiveCamera(38, W / H, 0.1, 400);
S.add(new THREE.HemisphereLight('#ffffff', '#7fb069', 1.3));
const sun = new THREE.DirectionalLight('#fff4dd', 2.2); sun.position.set(20, 40, 25); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 150 }); S.add(sun);
const mat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85 });
const box = (w, h, d, c, x, y, z, parent = S, o = {}) => { const m = new THREE.Mesh((o.round ? new RoundedBoxGeometry(w, h, d, 3, Math.min(w, h, d) * o.round) : new THREE.BoxGeometry(w, h, d)), Array.isArray(c) ? c : mat(c)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };
// ground: grass + road with studs-free flat plates
box(200, 1, 200, '#6cc04a', 0, -0.5, 0); box(200, 1.02, 8, '#5b5f6b', 0, -0.49, 6);
for (let x = -60; x < 60; x += 6) box(3, 1.04, 0.4, '#f4f4f4', x, -0.48, 6);
// face texture (simple smile, our own)
const face = (kind = 'smile', sk = '#f2c9a0') => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); g.fillStyle = sk; g.fillRect(0, 0, 256, 256);
  for (const x of [84, 172]) { g.fillStyle = '#fff'; g.beginPath(); g.ellipse(x, 112, 30, 34, 0, 0, 7); g.fill(); g.strokeStyle = '#2a1d17'; g.lineWidth = 6; g.stroke();
    g.fillStyle = '#2a1d17'; g.beginPath(); g.arc(x + 4, 118, 15, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(x + 10, 110, 5, 0, 7); g.fill();
    g.strokeStyle = '#2a1d17'; g.lineWidth = 9; g.lineCap = 'round'; g.beginPath(); g.moveTo(x - 24, 66 + (kind === 'worried' ? (x < 128 ? 8 : -8) : 0)); g.lineTo(x + 22, 62 + (kind === 'worried' ? (x < 128 ? -8 : 8) : 0)); g.stroke(); }
  g.fillStyle = 'rgba(255,110,110,0.35)'; for (const x of [56, 200]) { g.beginPath(); g.ellipse(x, 168, 20, 12, 0, 0, 7); g.fill(); }
  g.strokeStyle = '#2a1d17'; g.lineWidth = 8; g.lineCap = 'round'; g.beginPath();
  if (kind === 'smile') { g.moveTo(104, 182); g.quadraticCurveTo(128, 204, 152, 182); } else if (kind === 'grin') { g.fillStyle = '#7a2b2b'; g.moveTo(92, 176); g.quadraticCurveTo(128, 222, 164, 176); g.closePath(); g.fill(); } else { g.moveTo(108, 192); g.quadraticCurveTo(128, 180, 148, 192); }
  g.stroke(); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
// blocky person: legs, torso, arms, cube head. h = extra height blocks (the lie blocks)
const person = (x, z, o = {}) => { const P = new THREE.Group(); P.position.set(x, 0, z); S.add(P);
  const skin = o.skin || '#f2c9a0', sc = o.s || 1, shirt = o.shirt || '#3d7bff', pants = o.pants || '#2b2d42', extra = o.extra || 0;
  box(0.9, 2, 0.9, pants, -0.5, 1, 0, P, { round: 0.2 }); box(0.9, 2, 0.9, pants, 0.5, 1, 0, P, { round: 0.2 }); box(1, 0.5, 1.2, o.shoes || '#f4f4f4', -0.5, 0.25, 0.1, P, { round: 0.3 }); box(1, 0.5, 1.2, o.shoes || '#f4f4f4', 0.5, 0.25, 0.1, P, { round: 0.3 });
  const torsoH = 2 + extra; box(2, torsoH, 1, shirt, 0, 2 + torsoH / 2, 0, P, { round: 0.15 });
  for (let k = 0; k < extra; k++) box(2.04, 0.06, 1.04, '#00000033' && '#1d2a55', 0, 2 + 2 + k, 0, P); // stacked block seams
  box(0.85, 1.2, 0.85, shirt, -1.45, 2 + torsoH - 0.6, 0, P, { round: 0.2 }); box(0.8, 1.1, 0.8, skin, -1.45, 2 + torsoH - 1.7, 0, P, { round: 0.3 }); box(0.85, 1.2, 0.85, shirt, 1.45, 2 + torsoH - 0.6, 0, P, { round: 0.2 }); box(0.8, 1.1, 0.8, skin, 1.45, 2 + torsoH - 1.7, 0, P, { round: 0.3 });
  const fm = [mat(skin), mat(skin), mat(skin), mat(skin), new THREE.MeshStandardMaterial({ map: face(o.face, skin), roughness: 0.8 }), mat(skin)];
  box(1.8, 1.8, 1.8, fm, 0, 2 + torsoH + 0.95, 0, P); if (o.hair) { box(1.95, 0.55, 1.95, o.hair, 0, 2 + torsoH + 1.95, 0, P, { round: 0.25 }); box(1.95, 1.2, 0.4, o.hair, 0, 2 + torsoH + 1.4, -0.8, P, { round: 0.2 }); }
  if (o.hat) { box(2.4, 0.2, 2.4, o.hat, 0, 2 + torsoH + 1.95, 0, P); box(1.7, 1.4, 1.7, o.hat, 0, 2 + torsoH + 2.7, 0, P); }
  P.scale.setScalar(sc); return P; };
// houses
const house = (x, z, c, roof) => { box(8, 7, 7, c, x, 3.5, z); const r = box(9, 1.2, 8, roof, x, 7.6, z); box(6, 1.2, 6, roof, x, 8.8, z);
  box(1.8, 3, 0.2, '#6b3e26', x, 1.5, z + 3.6); for (const s of [-1, 1]) box(1.6, 1.6, 0.2, '#bfe8ff', x + s * 2.6, 4.5, z + 3.6); };
house(-16, -8, '#f7f3e9', '#d9534f'); house(16, -8, '#ffe8a3', '#3a7bd5'); house(-30, -14, '#d6f5d6', '#8e5cd9'); house(30, -14, '#ffd6e0', '#e07b39');
// clock tower
box(6, 30, 6, '#c9b79c', 0, 15, -20); box(7, 2, 7, '#8a6d4f', 0, 31, -20); box(4, 4, 0.3, '#fff', 0, 25, -16.9); box(0.3, 1.6, 0.35, '#222', 0, 25.6, -16.7); box(1.2, 0.3, 0.35, '#222', 0.5, 25, -16.7);
// trees
for (const [x, z] of [[-8, -4], [9, -3], [-24, 0], [24, 1]]) { box(1, 4, 1, '#7a4b2a', x, 2, z); box(4, 4, 4, '#3fa34d', x, 5.5, z); box(2.6, 2, 2.6, '#4dbb5a', x, 8.2, z); }
// cast: the mayor is HUGE, normal folks, our tiny hero
const mayor = person(8, -2, { shirt: '#2b2d42', pants: '#1b1c28', extra: 14, hat: '#1b1c28', skin: '#e0ac7e', face: 'grin', shoes: '#111' });
person(-5, 0, { shirt: '#e84a5f', extra: 3, skin: '#8d5a3b', hair: '#1b120c' }); person(-10, 2, { shirt: '#2ec4b6', extra: 6, skin: '#f5d0b0', hair: '#c9772c' });
const hero = person(1.5, 6, { shirt: '#ffb703', pants: '#3a86ff', s: 0.8, hair: '#5a3a22', face: 'worried' });
window.renderFrame = (f) => { const t = f / 30;
  cam.position.set(-2 + Math.sin(t * 0.3) * 0.5, 9, 48); cam.lookAt(1, 14, 0);
  hero.rotation.y = Math.sin(t * 2) * 0.1; R.render(S, cam); };
window.ready = true;
</script></body></html>
