const cv = document.getElementById('c'), g = cv.getContext('2d'), W = 1080, H = 1920;

const txt = (s, x, y, size, col = C.white, o = {}) => { g.save(); g.font = font(size); g.textAlign = o.align || 'center'; g.lineJoin = 'round'; let fs = size; while (g.measureText(s).width > (o.maxW || 980)) { fs -= 4; g.font = font(fs); }
