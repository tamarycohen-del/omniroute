<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000"><canvas id="c" width="2560" height="1440"></canvas><script>

  ring(false); const q = g.createRadialGradient(x - R * 0.34, y - R * 0.37, R * 0.1, x, y, R); q.addColorStop(0, '#ffb56a'); q.addColorStop(0.55, '#f07a1c'); q.addColorStop(1, '#8a3507'); g.fillStyle = q; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill();
