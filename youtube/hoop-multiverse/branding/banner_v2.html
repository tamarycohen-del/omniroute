<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000"><canvas id="c" width="2560" height="1440"></canvas><script>
// MULTIVERSE HOOPS — YouTube banner 2560x1440, title only. Painterly nebula (fbm noise), ringed basketball world with atmosphere,
// portal worlds, light streaks, 3D extruded title. Title + ball inside the 1546x423 safe area.
const c = document.getElementById('c'), g = c.getContext('2d'), W = 2560, H = 1440, hsh = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const glow = (x, y, r, col, a) => { const q = g.createRadialGradient(x, y, 1, x, y, r); q.addColorStop(0, `rgba(${col},${a})`); q.addColorStop(1, `rgba(${col},0)`); g.fillStyle = q; g.fillRect(x - r, y - r, 2 * r, 2 * r); };
// --- nebula texture (fbm value noise) ---
const neb = (seed, n, cols) => { const cv = document.createElement('canvas'); cv.width = n; cv.height = Math.round(n * 9 / 16); const x = cv.getContext('2d'), im = x.createImageData(cv.width, cv.height);
  const r = (i, j) => { const v = Math.sin(i * 127.1 + j * 311.7 + seed * 17.3) * 43758.5453; return v - Math.floor(v); }, s2 = (t) => t * t * (3 - 2 * t);
  const vn = (px, py) => { const i = Math.floor(px), j = Math.floor(py), fx = s2(px - i), fy = s2(py - j); const a = r(i, j), b = r(i + 1, j), c2 = r(i, j + 1), d = r(i + 1, j + 1); return a + (b - a) * fx + (c2 - a) * fy + (a - b - c2 + d) * fx * fy; };
  for (let yy = 0; yy < cv.height; yy++) for (let xx = 0; xx < cv.width; xx++) { let v = 0, amp = 0.55, f = 5 / n; for (let o = 0; o < 6; o++) { v += vn(xx * f + seed, yy * f) * amp; f *= 2.03; amp *= 0.5; } const t = Math.max(0, Math.min(1, (v - 0.35) * 2)); const k = (yy * cv.width + xx) * 4; im.data[k] = cols[0] * t; im.data[k + 1] = cols[1] * t; im.data[k + 2] = cols[2] * t; im.data[k + 3] = 255 * Math.pow(t, 1.4); }
  x.putImageData(im, 0, 0); return cv; };
g.fillStyle = '#04030c'; g.fillRect(0, 0, W, H);
g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.85; g.drawImage(neb(1, 640, [120, 60, 255]), 0, 0, W, H); g.globalAlpha = 0.55; g.drawImage(neb(7, 640, [30, 140, 255]), 0, 0, W, H); g.globalAlpha = 0.35; g.drawImage(neb(13, 640, [255, 90, 170]), 0, 0, W, H); g.globalAlpha = 1;
glow(1280, 700, 1100, '90,50,200', 0.25); glow(660, 720, 700, '255,140,60', 0.18); g.globalCompositeOperation = 'source-over';
const vg = g.createRadialGradient(1280, 720, 500, 1280, 720, 1500); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
for (let i = 0; i < 1400; i++) { const r = Math.pow(hsh(i + 9), 3) * 3.5 + 0.5; g.fillStyle = `rgba(255,255,255,${0.2 + hsh(i + 3) * 0.8})`; g.beginPath(); g.arc(hsh(i) * W, hsh(i + 1) * H, r, 0, 7); g.fill(); }
g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 12; i++) { const x = hsh(i + 50) * W, y = hsh(i + 60) * H, r = 30 + hsh(i + 70) * 60; glow(x, y, r, '220,210,255', 0.5); g.strokeStyle = 'rgba(230,220,255,0.35)'; g.lineWidth = 2; g.beginPath(); g.moveTo(x - r * 1.6, y); g.lineTo(x + r * 1.6, y); g.moveTo(x, y - r * 1.6); g.lineTo(x, y + r * 1.6); g.stroke(); } g.globalCompositeOperation = 'source-over';
// --- light streaks (warp) ---
g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 70; i++) { const a = hsh(i + 200) * Math.PI * 2, r0 = 700 + hsh(i + 201) * 400, r1 = r0 + 300 + hsh(i + 202) * 700; const q = g.createLinearGradient(1280 + Math.cos(a) * r0, 720 + Math.sin(a) * r0 * 0.56, 1280 + Math.cos(a) * r1, 720 + Math.sin(a) * r1 * 0.56); q.addColorStop(0, 'rgba(180,160,255,0)'); q.addColorStop(1, `rgba(180,160,255,${0.1 + hsh(i) * 0.15})`); g.strokeStyle = q; g.lineWidth = 1 + hsh(i + 3) * 4; g.beginPath(); g.moveTo(1280 + Math.cos(a) * r0, 720 + Math.sin(a) * r0 * 0.56); g.lineTo(1280 + Math.cos(a) * r1, 720 + Math.sin(a) * r1 * 0.56); g.stroke(); } g.globalCompositeOperation = 'source-over';
// --- other worlds (each a tiny planet with a rim and atmosphere) ---
const world = (x, y, r, c1, c2, ring) => { g.globalCompositeOperation = 'lighter'; glow(x, y, r * 2.2, c2, 0.35); g.globalCompositeOperation = 'source-over'; const q = g.createRadialGradient(x - r * 0.4, y - r * 0.45, r * 0.05, x, y, r); q.addColorStop(0, '#ffffff'); q.addColorStop(0.35, c1); q.addColorStop(1, '#0b0820'); g.fillStyle = q; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.strokeStyle = `rgba(${c2},0.8)`; g.lineWidth = r * 0.06; g.beginPath(); g.arc(x, y, r, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
  if (ring) { g.save(); g.translate(x, y); g.rotate(-0.3); g.strokeStyle = `rgba(${c2},0.7)`; g.lineWidth = r * 0.08; g.beginPath(); g.ellipse(0, 0, r * 1.7, r * 0.45, 0, 0, 7); g.stroke(); g.restore(); } };
world(2240, 300, 95, '#9b7dff', '170,140,255', true); world(330, 1060, 120, '#3fd0b0', '90,230,200', false); world(2330, 1080, 55, '#7fe7ff', '127,231,255', false); world(420, 330, 40, '#ffc72c', '255,200,90', false); world(1880, 1210, 35, '#ff7ab8', '255,120,190', false);
// --- the basketball world ---
const ball = (x, y, R) => { g.globalCompositeOperation = 'lighter'; glow(x, y, R * 2.4, '255,150,60', 0.45); glow(x + R * 0.5, y - R * 0.6, R * 1.2, '255,220,160', 0.25); g.globalCompositeOperation = 'source-over';
  const ring = (front) => { g.save(); g.translate(x, y); g.rotate(-0.38); g.lineCap = 'round'; for (const [w, col] of [[R * 0.22, 'rgba(255,199,44,0.18)'], [R * 0.11, 'rgba(255,199,44,0.45)'], [R * 0.05, '#ffcf45'], [R * 0.018, '#fff7d6']]) { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.ellipse(0, 0, R * 1.62, R * 0.44, 0, front ? 0 : Math.PI, front ? Math.PI : 2 * Math.PI); g.stroke(); } for (let k = 0; k < 40; k++) { const a = (front ? 0 : Math.PI) + hsh(k + (front ? 0 : 99)) * Math.PI; g.fillStyle = 'rgba(255,235,170,0.9)'; g.beginPath(); g.arc(Math.cos(a) * R * 1.62 * (0.92 + hsh(k + 5) * 0.16), Math.sin(a) * R * 0.44 * (0.92 + hsh(k + 6) * 0.16), 2 + hsh(k) * 4, 0, 7); g.fill(); } g.restore(); };
  ring(false); const q = g.createRadialGradient(x - R * 0.35, y - R * 0.4, R * 0.08, x, y, R); q.addColorStop(0, '#ffc488'); q.addColorStop(0.45, '#f27c1e'); q.addColorStop(0.85, '#a3410b'); q.addColorStop(1, '#4a1a04'); g.fillStyle = q; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill();
  g.save(); g.beginPath(); g.arc(x, y, R, 0, 7); g.clip(); g.fillStyle = 'rgba(70,25,5,0.25)'; for (let k = 0; k < 900; k++) { const a = hsh(k) * 7, d = Math.sqrt(hsh(k + 1)) * R; g.fillRect(x + Math.cos(a) * d, y + Math.sin(a) * d, 3, 3); }
  g.strokeStyle = '#2a1205'; g.lineWidth = R * 0.05; g.lineCap = 'round'; g.beginPath(); g.moveTo(x - R, y + R * 0.05); g.quadraticCurveTo(x, y - R * 0.08, x + R, y + R * 0.05); g.moveTo(x + R * 0.05, y - R); g.quadraticCurveTo(x - R * 0.05, y, x + R * 0.05, y + R); g.stroke(); g.beginPath(); g.arc(x - R * 1.3, y, R * 1.08, -0.95, 0.95); g.stroke(); g.beginPath(); g.arc(x + R * 1.3, y, R * 1.08, Math.PI - 0.95, Math.PI + 0.95); g.stroke();
  const sh = g.createLinearGradient(x - R, y - R, x + R, y + R); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(0.55, 'rgba(0,0,0,0.05)'); sh.addColorStop(1, 'rgba(10,0,30,0.65)'); g.fillStyle = sh; g.fillRect(x - R, y - R, 2 * R, 2 * R); g.restore();
  g.strokeStyle = 'rgba(255,220,170,0.75)'; g.lineWidth = R * 0.035; g.beginPath(); g.arc(x, y, R * 0.985, -2.4, -0.6); g.stroke(); g.strokeStyle = 'rgba(160,120,255,0.6)'; g.lineWidth = R * 0.03; g.beginPath(); g.arc(x, y, R * 0.99, 0.4, 1.9); g.stroke();
  ring(true); };
ball(720, 720, 175);
// --- lens flare on the ball's lit edge ---
g.globalCompositeOperation = 'lighter'; glow(820, 590, 90, '255,240,210', 0.9); g.strokeStyle = 'rgba(255,235,200,0.5)'; g.lineWidth = 3; g.beginPath(); g.moveTo(560, 590); g.lineTo(1080, 590); g.stroke(); for (const [k, r] of [[0.3, 26], [0.55, 14], [0.8, 40]]) glow(820 + (1280 - 820) * k * 1.6, 590 + (720 - 590) * k * 1.6, r, '200,170,255', 0.4); g.globalCompositeOperation = 'source-over';
// --- 3D extruded title ---
const title = (s, x, y, size, top, bot, glowCol) => { g.font = `italic 900 ${size}px "DejaVu Sans", sans-serif`; g.textAlign = 'center'; g.lineJoin = 'round';
  for (let d = 18; d > 0; d--) { g.fillStyle = `rgb(${20 + d},${10 + d},${45 + d * 2})`; g.fillText(s, x + d * 0.9, y + d * 1.1); }
  g.shadowColor = glowCol; g.shadowBlur = 60; g.lineWidth = 14; g.strokeStyle = '#0a0618'; g.strokeText(s, x, y); g.shadowBlur = 0;
  const q = g.createLinearGradient(0, y - size * 0.85, 0, y + size * 0.1); q.addColorStop(0, top); q.addColorStop(0.55, bot); q.addColorStop(0.56, '#f2a41c'); q.addColorStop(1, '#c4730c'); g.fillStyle = q; g.fillText(s, x, y);
  g.save(); g.globalCompositeOperation = 'lighter'; g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,0.55)'; g.strokeText(s, x - 2, y - 3); g.restore(); };
title('MULTIVERSE', 1410, 700, 160, '#ffffff', '#d9d2ff', 'rgba(150,110,255,0.95)');
