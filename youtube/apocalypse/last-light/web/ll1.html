<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// LAST LIGHT - Part 1. Original creatures ("the Hollow"), original city. Times match ep1/audio/words1.json.
import { capCard, whiteStick } from './stick.js';
import { biscuit } from './biscuit.js';
const cv = document.getElementById('c'), g = cv.getContext('2d'), W = 1080, H = 1920, P = { g };
const rr = (x, y, w, h, r, fill) => { g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = fill; g.fill(); };
const lin = (x0, y0, x1, y1, st) => { const q = g.createLinearGradient(x0, y0, x1, y1); st.forEach(([o, c]) => q.addColorStop(o, c)); return q; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), sm = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const add = (fn) => { g.save(); g.globalCompositeOperation = 'lighter'; fn(); g.restore(); };
const cam = (z, fx, fy, sx = 0, sy = 0) => { g.translate(W / 2 + sx, H / 2 + sy); g.scale(z, z); g.translate(-fx, -fy); };
const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
let T = 0, WORDS = [];
const O = '#121018';
const hero = (x, y, s, o = {}) => { const br = Math.sin(T * 2.4 + x * 0.01) * 0.012; g.save(); g.translate(x, y + 975 * s * br * 0.5); g.scale(s * (o.flip ? -1 : 1), s * (1 - br)); if (o.flip) g.translate(-600, 0);
  // backpack behind the body
  rr(196, 600, 96, 170, 26, '#5a4630'); g.strokeStyle = O; g.lineWidth = 9; g.beginPath(); g.roundRect(196, 600, 96, 170, 26); g.stroke(); rr(208, 680, 72, 40, 10, '#4a3824');
  whiteStick(P, { beanie: '#2a2a36', ...o }); g.restore(); };
const dog = (x, y, s, o = {}) => { const br = Math.sin(T * 3.2 + x * 0.02) * 0.02; g.save(); g.translate(x, y); g.scale(s, s * (1 + br)); biscuit(g, { tail: 0.15, ...o, t: o.t ?? T }); g.restore(); };

// ---------- the world: an overgrown city at sunset ----------
const GY = 1500;
const sky = (k = 0) => { g.fillStyle = lin(0, -600, 0, 1500, [[0, '#2a1340'], [0.45, '#8a2e3c'], [0.75, '#f0703a'], [1, '#ffc46a']]); g.fillRect(-1400, -900, 4000, 2500);
  const sy = 1020 + 120 * k; add(() => { const rg = g.createRadialGradient(540, sy, 20, 540, sy, 900); rg.addColorStop(0, 'rgba(255,220,140,0.9)'); rg.addColorStop(0.15, 'rgba(255,150,80,0.45)'); rg.addColorStop(1, 'rgba(255,120,60,0)'); g.fillStyle = rg; g.fillRect(-1400, -900, 4000, 2600); });
  g.fillStyle = '#ffe2a0'; g.beginPath(); g.arc(540, sy, 120, 0, 7); g.fill(); };
const towers = (scroll = 0) => { // far skyline (one layer), broken tops, dead windows
  for (let i = -6; i < 14; i++) { const x = i * 230 - (scroll * 0.25) % 230 - 600, h = 520 + hash(i + 3) * 700, w = 170 + hash(i + 9) * 80; const id = i + Math.floor(scroll * 0.25 / 230);
    const hh = 380 + hash(id + 3) * 520, ww = 170 + hash(id + 9) * 80; g.fillStyle = '#3a1c36'; g.beginPath(); g.moveTo(x, GY - 120); g.lineTo(x, GY - 120 - hh); g.lineTo(x + ww * 0.4, GY - 120 - hh + 40 * hash(id)); g.lineTo(x + ww * 0.7, GY - 120 - hh - 30); g.lineTo(x + ww, GY - 120 - hh + 60); g.lineTo(x + ww, GY - 120); g.fill();
    g.fillStyle = 'rgba(255,170,110,0.13)'; for (let r = 0; r < hh / 70 - 1; r++) for (let c = 0; c < 3; c++) if (hash(id * 31 + r * 7 + c) > 0.55) g.fillRect(x + 22 + c * (ww - 40) / 3, GY - 120 - hh + 60 + r * 70, 26, 34); } };
const vines = (x, y, h, k = 1) => { g.strokeStyle = '#2c4a22'; g.lineWidth = 10; g.beginPath(); g.moveTo(x, y); for (let i = 1; i <= 8; i++) g.lineTo(x + Math.sin(i * 1.7 + x) * 22, y + (h * i) / 8); g.stroke(); g.fillStyle = '#3c6a2a'; for (let i = 1; i < 8; i++) { g.beginPath(); g.ellipse(x + Math.sin(i * 1.7 + x) * 22 + 16, y + (h * i) / 8, 18, 9, 0.6, 0, 7); g.fill(); } };
const nearBuildings = (scroll = 0) => { for (let i = -3; i < 9; i++) { const id = i + Math.floor(scroll / 520), x = id * 520 - scroll - 200, h = 420 + hash(id * 5) * 360; if (hash(id * 7) > 0.55) continue;
    g.fillStyle = '#2a1426'; g.fillRect(x, GY - h, 480, h); g.fillStyle = '#1c0c1a'; g.fillRect(x + 470, GY - h, 14, h);
    for (let r = 0; r < 8; r++) for (let c = 0; c < 4; c++) { const wx = x + 40 + c * 110, wy = GY - h + 60 + r * 110; if (wy > GY - 260) continue; g.fillStyle = hash(id * 13 + r * 4 + c) > 0.3 ? '#0e0610' : 'rgba(255,160,100,0.35)'; g.fillRect(wx, wy, 70, 80); }
    vines(x + 60 + hash(id) * 300, GY - h + 40, 500 + hash(id + 1) * 300); } };
const street = (scroll = 0) => { g.fillStyle = lin(0, GY - 20, 0, GY + 500, [[0, '#3a2a30'], [1, '#140c14']]); g.fillRect(-1400, GY - 20, 4000, 1400);
  g.fillStyle = 'rgba(255,210,120,0.25)'; for (let x = -1400; x < 2600; x += 220) { const xx = x - (scroll % 220); g.fillRect(xx, GY + 170, 110, 12); }
  g.strokeStyle = '#120a10'; g.lineWidth = 5; for (let i = 0; i < 14; i++) { const x = ((i * 390 - scroll) % 3200 + 3200) % 3200 - 1000; g.beginPath(); g.moveTo(x, GY + 40); g.lineTo(x + 40, GY + 110); g.lineTo(x + 20, GY + 190); g.stroke(); }
  for (let i = 0; i < 40; i++) { const x = ((i * 157 - scroll) % 3400 + 3400) % 3400 - 1100, y = GY + 10 + (i * 53) % 300; g.strokeStyle = i % 3 ? '#3e6a2c' : '#567f34'; g.lineWidth = 6; for (let b = -2; b <= 2; b++) { g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + b * 10, y - 30, x + b * 18 + Math.sin(T * 2 + i) * 5, y - 55 - (i % 4) * 10); g.stroke(); } } };
const rustCar = (x, y, s, o = {}) => { g.save(); g.translate(x, y); g.scale(s * (o.flip ? -1 : 1), s); g.lineJoin = 'round'; const body = o.col || '#6a3a2a';
  g.fillStyle = 'rgba(0,0,0,0.45)'; g.beginPath(); g.ellipse(0, 6, 520, 26, 0, 0, 7); g.fill();
  g.fillStyle = body; g.strokeStyle = O; g.lineWidth = 10; g.beginPath(); g.moveTo(-300, -235); g.lineTo(-230, -390); g.lineTo(150, -390); g.lineTo(260, -235); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = '#140a12'; g.beginPath(); g.moveTo(-262, -245); g.lineTo(-215, -372); g.lineTo(-30, -372); g.lineTo(-30, -245); g.fill(); g.beginPath(); g.moveTo(0, -245); g.lineTo(0, -372); g.lineTo(140, -372); g.lineTo(232, -245); g.fill();
  g.fillStyle = body; g.beginPath(); g.roundRect(-480, -250, 960, 180, 46); g.fill(); g.stroke();
  g.fillStyle = 'rgba(140,60,20,0.6)'; for (let i = 0; i < 9; i++) { g.beginPath(); g.ellipse(-400 + i * 100 + hash(i + x) * 40, -150 + hash(i * 3 + x) * 60, 30 + hash(i) * 30, 16, 0, 0, 7); g.fill(); }
  for (const wx of [-300, 300]) { g.fillStyle = '#0c0a12'; g.beginPath(); g.arc(wx, -70, 74, 0, 7); g.fill(); g.strokeStyle = O; g.stroke(); g.fillStyle = '#4a3a3a'; g.beginPath(); g.arc(wx, -70, 30, 0, 7); g.fill(); }
  vines(-200, -390, 300); vines(180, -260, 200); g.restore(); };
const suv = (x, y, s, glint = 0) => { g.save(); g.translate(x, y); g.scale(s, s); g.lineJoin = 'round';
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.beginPath(); g.ellipse(0, 8, 560, 30, 0, 0, 7); g.fill();
  g.fillStyle = '#3c4232'; g.strokeStyle = O; g.lineWidth = 12; g.beginPath(); g.moveTo(-480, -280); g.lineTo(-440, -500); g.lineTo(300, -500); g.lineTo(380, -300); g.lineTo(500, -280); g.lineTo(500, -90); g.lineTo(-500, -90); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = '#0e1210'; g.fillRect(-400, -470, 300, 140); g.fillRect(-60, -470, 300, 140); g.strokeStyle = '#2a3024'; g.lineWidth = 8; for (let k = 0; k < 5; k++) { g.beginPath(); g.moveTo(-400 + k * 75, -470); g.lineTo(-400 + k * 75, -330); g.stroke(); g.beginPath(); g.moveTo(-60 + k * 75, -470); g.lineTo(-60 + k * 75, -330); g.stroke(); }
  g.fillStyle = '#2c3224'; g.fillRect(-490, -300, 990, 40); g.fillStyle = '#7c8270'; for (let k = 0; k < 14; k++) { g.beginPath(); g.arc(-460 + k * 70, -280, 7, 0, 7); g.fill(); }
  g.fillStyle = '#1a1e16'; g.fillRect(420, -260, 90, 150); g.strokeStyle = '#7c8270'; g.lineWidth = 6; for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(430, -240 + k * 36); g.lineTo(500, -240 + k * 36); g.stroke(); }
  for (const wx of [-310, 310]) { g.fillStyle = '#0a0a0c'; g.beginPath(); g.arc(wx, -90, 100, 0, 7); g.fill(); g.strokeStyle = O; g.lineWidth = 10; g.stroke(); g.fillStyle = '#5a5e52'; g.beginPath(); g.arc(wx, -90, 40, 0, 7); g.fill(); }
  if (glint > 0) add(() => { const gx = 160, gy = -440, r = 260 * glint; g.fillStyle = `rgba(255,250,220,${glint})`; g.beginPath(); g.moveTo(gx - r, gy); g.lineTo(gx, gy - 14); g.lineTo(gx + r, gy); g.lineTo(gx, gy + 14); g.fill(); g.beginPath(); g.moveTo(gx, gy - r * 0.6); g.lineTo(gx + 12, gy); g.lineTo(gx, gy + r * 0.6); g.lineTo(gx - 12, gy); g.fill(); const rg = g.createRadialGradient(gx, gy, 2, gx, gy, 120); rg.addColorStop(0, `rgba(255,255,230,${glint})`); rg.addColorStop(1, 'rgba(255,255,230,0)'); g.fillStyle = rg; g.fillRect(gx - 120, gy - 120, 240, 240); });
  g.restore(); };
const doorway = (x, y, s, o = {}) => { g.save(); g.translate(x, y); g.scale(s, s); // abandoned building front, black entrance
  g.fillStyle = '#2e1828'; g.fillRect(-500, -1500, 1000, 1500); g.fillStyle = '#3a2030'; g.fillRect(-520, -340, 1040, 40);
  g.fillStyle = '#5a3a3a'; g.save(); g.translate(-200, -400); g.rotate(-0.08); rr(-180, -60, 360, 90, 8, '#5a3a3a'); g.fillStyle = 'rgba(255,200,150,0.5)'; g.font = '900 54px "DejaVu Sans", sans-serif'; g.textAlign = 'center'; g.fillText('M_RKET', 0, 6); g.restore();
  g.fillStyle = '#020103'; g.fillRect(-230, -300, 460, 300); g.strokeStyle = '#1a0c16'; g.lineWidth = 20; g.strokeRect(-240, -310, 480, 310);
  g.fillStyle = 'rgba(0,0,0,0.6)'; for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) g.fillRect(-440 + c * 240, -1400 + r * 260, 140, 170);
  vines(-470, -1500, 1100); vines(420, -1400, 900); vines(250, -330, 200);
  if (o.inside) o.inside(); // drawn inside the black door
  g.restore(); };

// ---------- the Hollow: pale, thin, eyeless, wide mouth (original design) ----------
const PALE = '#d9d3c8', PALE_D = '#a9a196';
const plimb = (pts, w = 26) => { for (const [ww, c] of [[w + 12, O], [w, PALE]]) { g.strokeStyle = c; g.lineWidth = ww; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke(); } };
const hollowHead = (x, y, r, mouth, rot = 0) => { g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = PALE; g.strokeStyle = O; g.lineWidth = 10; g.beginPath(); g.ellipse(0, 0, r, r * 1.15, 0, 0, 7); g.fill(); g.stroke();
  g.fillStyle = 'rgba(120,110,100,0.35)'; for (const sx of [-1, 1]) { g.beginPath(); g.ellipse(sx * r * 0.42, -r * 0.2, r * 0.26, r * 0.14, 0, 0, 7); g.fill(); } // smooth skin where eyes would be
  const mw = r * (0.55 + 0.25 * mouth), mh = r * (0.12 + 0.6 * mouth); g.fillStyle = '#0a0406'; g.beginPath(); g.ellipse(0, r * 0.45, mw, mh, 0, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#efe8da'; const n = 7; for (let k = 0; k < n; k++) { const tx = -mw * 0.8 + (k * 1.6 * mw) / (n - 1); g.beginPath(); g.moveTo(tx - 7, r * 0.45 - mh * 0.85); g.lineTo(tx + 7, r * 0.45 - mh * 0.85); g.lineTo(tx, r * 0.45 - mh * 0.45); g.fill(); g.beginPath(); g.moveTo(tx - 7, r * 0.45 + mh * 0.85); g.lineTo(tx + 7, r * 0.45 + mh * 0.85); g.lineTo(tx, r * 0.45 + mh * 0.45); g.fill(); }
  g.restore(); };
// side view crouched, feet at (x,y); face 1 = looking right. o: mouth 0..1, lean 0..1 (about to charge), crawl 0..1, phase
const hollow = (x, y, s, o = {}) => { const ph = (o.phase || 0) + T * (o.speed || 1), br = Math.sin(ph * 5) * 6; const m = o.mouth ?? 0.2, ln = o.lean ?? 0.3;
  g.save(); g.translate(x, y); g.scale(s * (o.face ?? 1), s); g.lineCap = 'round'; g.lineJoin = 'round'; if (o.dim) g.globalAlpha = o.dim;
  const hip = [-40, -300 + br * 0.5], sh = [90 + 60 * ln, -430 + 50 * ln + br], head = [190 + 90 * ln, -470 + 60 * ln + br];
  plimb([hip, [-120, -170], [-60, 0]]); plimb([hip, [10, -150], [60, 0]]); // legs (bent)
  g.fillStyle = PALE; g.strokeStyle = O; g.lineWidth = 12; g.beginPath(); g.moveTo(hip[0] - 50, hip[1]); g.quadraticCurveTo(hip[0] + 20, hip[1] - 200, sh[0], sh[1] - 30); g.lineTo(sh[0] + 30, sh[1] + 40); g.quadraticCurveTo(hip[0] + 60, hip[1] - 40, hip[0] + 30, hip[1] + 30); g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = PALE_D; g.lineWidth = 5; for (let k = 0; k < 5; k++) { g.beginPath(); g.arc(hip[0] + 20 + k * 22, hip[1] - 60 - k * 22, 18, 3.6, 4.6); g.stroke(); } // spine bumps
  const reach = o.reach ?? 0; plimb([[sh[0], sh[1]], [sh[0] + 60 + 120 * reach, sh[1] + 180 - 160 * reach], [sh[0] + 90 + 230 * reach, -10 - 300 * reach]], 22);
  plimb([[sh[0] - 10, sh[1] + 10], [sh[0] + 20, sh[1] + 200], [sh[0] + 30 + 40 * Math.sin(ph * 3) * (o.crawl || 0), -8]], 22);
  for (const [fx, fy] of [[sh[0] + 90 + 230 * reach, -10 - 300 * reach]]) { g.strokeStyle = O; g.lineWidth = 9; for (let k = -1; k <= 1; k++) { g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx + 50, fy + k * 22 + 10); g.stroke(); } g.strokeStyle = PALE; g.lineWidth = 5; for (let k = -1; k <= 1; k++) { g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx + 48, fy + k * 22 + 10); g.stroke(); } }
  hollowHead(head[0], head[1], 70, m + 0.05 * Math.sin(ph * 11), 0.35 + 0.2 * ln);
  g.restore(); };
// front view, leaping at the camera
const hollowLeap = (x, y, s, o = {}) => { const m = o.mouth ?? 1; g.save(); g.translate(x, y); g.scale(s, s); g.lineCap = 'round'; g.lineJoin = 'round';
  plimb([[-60, 120], [-200, 260], [-160, 420]], 30); plimb([[60, 120], [200, 250], [170, 420]], 30);
  g.fillStyle = PALE; g.strokeStyle = O; g.lineWidth = 12; g.beginPath(); g.ellipse(0, 40, 120, 160, 0, 0, 7); g.fill(); g.stroke();
  g.strokeStyle = PALE_D; g.lineWidth = 6; for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(-70, -20 + k * 40); g.quadraticCurveTo(0, 0 + k * 40, 70, -20 + k * 40); g.stroke(); } // ribs
  for (const sx of [-1, 1]) { plimb([[sx * 90, -60], [sx * 300, -120], [sx * 430, -260]], 30); g.strokeStyle = O; g.lineWidth = 14; for (let k = -2; k <= 2; k++) { g.beginPath(); g.moveTo(sx * 430, -260); g.lineTo(sx * (480 + 20 * Math.abs(k)), -330 + k * 30); g.stroke(); } g.strokeStyle = PALE; g.lineWidth = 7; for (let k = -2; k <= 2; k++) { g.beginPath(); g.moveTo(sx * 430, -260); g.lineTo(sx * (478 + 20 * Math.abs(k)), -330 + k * 30); g.stroke(); } }
  hollowHead(0, -170, 120, m, 0); g.restore(); };

// ---------- props ----------
const flareHand = (x, y, s, glow = 0) => { g.save(); g.translate(x, y); g.scale(s, s); g.rotate(-0.25);
  rr(-60, -260, 120, 420, 26, '#5a2ab0'); g.strokeStyle = O; g.lineWidth = 12; g.beginPath(); g.roundRect(-60, -260, 120, 420, 26); g.stroke(); rr(-70, -300, 140, 80, 18, '#2a1a40'); g.stroke();
  g.fillStyle = '#ffe14a'; g.fillRect(-60, -120, 120, 36); g.fillStyle = '#1a1020'; g.font = '900 32px "DejaVu Sans", sans-serif'; g.textAlign = 'center'; g.fillText('UV', 0, -91);
  if (glow > 0) add(() => { const rg = g.createRadialGradient(0, -300, 10, 0, -300, 500); rg.addColorStop(0, `rgba(190,120,255,${0.7 * glow})`); rg.addColorStop(1, 'rgba(190,120,255,0)'); g.fillStyle = rg; g.fillRect(-600, -900, 1200, 1200); });
  for (const [w, c] of [[110, O], [86, '#f4f2ee']]) { g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(-400, 520); g.lineTo(-140, 120); g.stroke(); }
  for (let k = 0; k < 4; k++) { for (const [w, c] of [[48, O], [30, '#f4f2ee']]) { g.strokeStyle = c; g.lineWidth = w; g.beginPath(); g.moveTo(-110, -30 + k * 60); g.lineTo(60, -40 + k * 60); g.stroke(); } }
  g.restore(); };

const walkie = (x, y, s, o = {}) => { g.save(); g.translate(x, y); g.scale(s, s); g.rotate(o.rot || 0); g.lineJoin = 'round';
  g.strokeStyle = O; g.lineWidth = 14; g.beginPath(); g.moveTo(60, -230); g.lineTo(60, -420); g.stroke(); g.strokeStyle = '#2a2a30'; g.lineWidth = 8; g.stroke();
  rr(-110, -250, 220, 420, 34, '#2c2e2a'); g.strokeStyle = O; g.lineWidth = 12; g.beginPath(); g.roundRect(-110, -250, 220, 420, 34); g.stroke();
  rr(-80, -200, 160, 130, 14, '#151714'); g.fillStyle = '#3a3c36'; for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) { g.beginPath(); g.arc(-60 + c * 24, -175 + r * 28, 6, 0, 7); g.fill(); }
  rr(-80, -40, 160, 70, 10, o.beep ? '#ff3a3a' : '#7ad88a'); g.fillStyle = '#0a1a0c'; g.font = '700 30px "DejaVu Sans Mono", monospace'; g.textAlign = 'center'; g.fillText(o.beep ? 'CH 9 !' : 'CH 9', 0, 6);
  const led = o.beep ? (Math.floor(T * 8) % 2 ? '#ff2a2a' : '#4a0a0a') : (o.talk ? '#3aff6a' : '#1a4a22'); g.fillStyle = led; g.beginPath(); g.arc(-70, -225, 12, 0, 7); g.fill();
  if (o.beep || o.talk) add(() => { const c = o.beep ? '255,40,40' : '60,255,110'; const rg = g.createRadialGradient(-70, -225, 2, -70, -225, 120); rg.addColorStop(0, `rgba(${c},0.8)`); rg.addColorStop(1, `rgba(${c},0)`); g.fillStyle = rg; g.fillRect(-200, -350, 260, 260); });
  g.strokeStyle = 'rgba(220,215,200,0.85)'; g.lineWidth = 6; for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(-90 + k * 26, 50 + k * 8); g.lineTo(40 + k * 26, 150 + k * 8); g.stroke(); } // claw scratches
  if (o.talk) { g.strokeStyle = '#3aff6a'; g.lineWidth = 6; g.beginPath(); for (let i = 0; i <= 40; i++) { const xx = -150 - 200 + i * 10, yy = -130 + Math.sin(i * 0.9 + T * 30) * 40 * Math.sin(i / 40 * Math.PI) * o.talk; i ? g.lineTo(xx, yy) : g.moveTo(xx, yy); } g.stroke(); }
  g.restore(); };
const bag = (x, y, s, o = {}) => { g.save(); g.translate(x, y); g.scale(s, s); g.lineJoin = 'round'; g.fillStyle = 'rgba(0,0,0,0.4)'; g.beginPath(); g.ellipse(0, 6, 220, 22, 0, 0, 7); g.fill();
  g.fillStyle = '#3e5a3a'; g.strokeStyle = O; g.lineWidth = 12; g.beginPath(); g.moveTo(-200, 0); g.quadraticCurveTo(-220, -200, -60, -230); g.lineTo(80, -230); g.quadraticCurveTo(220, -200, 200, 0); g.closePath(); g.fill(); g.stroke();
  rr(-110, -120, 220, 100, 20, '#34502f'); g.stroke(); g.strokeStyle = 'rgba(220,215,200,0.85)'; g.lineWidth = 7; for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(-150 + k * 30, -200); g.lineTo(-40 + k * 30, -40); g.stroke(); }
  if (o.open) { g.fillStyle = '#0a0a08'; g.beginPath(); g.ellipse(10, -225, 120, 26, 0, 0, 7); g.fill(); }
